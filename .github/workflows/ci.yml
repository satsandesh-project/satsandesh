name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff pytest

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  gateway-tests:
    # New job, added alongside lint-and-test (which is untouched above).
    # Root pyproject.toml's testpaths = ["tests"] means the existing job's
    # bare `pytest` only ever runs tests/test_placeholder.py -- it has
    # never run services/gateway/'s real suite. This job does, against a
    # throwaway postgres:16 service container, the same version the
    # gateway's own README documents for local dev.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          # One database here, not the dev+test pair services/gateway/README.md
          # describes -- there's no dev data to protect in a throwaway CI
          # run, so DATABASE_URL and TEST_DATABASE_URL below both point at
          # this same database.
          POSTGRES_DB: satsandesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same names services/gateway/app/config.py requires with no default
      # (see its own comment on why a missing one crashes at startup
      # rather than silently). Placeholder values, matching the pattern
      # .env.example already uses for local dev.
      DATABASE_URL: postgresql://postgres:devpass@localhost:5432/satsandesh_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:devpass@localhost:5432/satsandesh_test
      JWT_SECRET: ci-placeholder-secret
      VAPID_PRIVATE_KEY: ci-placeholder-vapid-private
      VAPID_PUBLIC_KEY: ci-placeholder-vapid-public
      VAPID_SUBJECT: mailto:ci@example.com
      # Week 6 media storage (#63/#69): app/config.py requires this with no
      # default too, same reasoning as DATABASE_URL/JWT_SECRET above. Landed
      # on main via #69 without this job's env block being updated for it,
      # so alembic upgrade head (below) failed Settings() validation before
      # any test ran. A plain writable path is all this job needs -- no
      # volume, no persistence, this container is thrown away after the run.
      MEDIA_STORAGE_ROOT: /tmp/satsandesh-media-ci
      # Deliberately NOT set: CORS_ORIGINS. tests/test_config.py::test_settings_load_from_env
      # asserts it defaults to [] when absent -- setting it here would make
      # that specific test fail for a CI-environment reason unrelated to
      # the code being tested.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gateway dependencies
        working-directory: services/gateway
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: services/gateway
        run: python -m alembic upgrade head

      - name: Run gateway tests
        working-directory: services/gateway
        run: python -m pytest tests/

  ai-tests:
    # Same root cause gateway-tests fixes, one directory over: root
    # pyproject.toml's testpaths never reached services/ai/, so its contract,
    # fixture and mock-server tests (and, once merged, services/ai/moderation/
    # -- M4's lane) never ran in CI either. No database needed: everything
    # under services/ai/ runs against Pydantic models and in-process
    # TestClients. Model-weight tests are marked `integration` and skipped by
    # services/ai/pyproject.toml's addopts, so this job stays fast and
    # download-free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        # speech_indicconformer/tests (and services/ai/speech/'s own ffmpeg
        # decode path, same shared decode_via_ffmpeg()) needs the real `ffmpeg`
        # binary on PATH for its ogg_opus/mp3 format tests -- confirmed via a
        # CI-only diagnostic run that the ubuntu-latest image does NOT include
        # it (`which ffmpeg` -> command not found), unlike most local dev
        # machines, which is why this was never caught before now: this is the
        # first suite in ai-tests to actually exercise that code path.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install AI service dependencies
        # dev + render-tts: render-tts is the lean Piper-only slice of the
        # `render` extras group (onnxruntime + pathvalidate, no torch) --
        # render/tests/test_render_app.py always exercises real Piper voices,
        # even in its "stub" tests (only the MT step is stubbed there), so
        # this is installed unconditionally to run that suite for real. The
        # full `render` group (torch/transformers/indictranstoolkit) stays
        # out, same reasoning as the `mt` group on feat/ai-mt-pivot-w6 -- it's
        # only needed by the one `integration`-marked real-MT test, skipped
        # by default.
        working-directory: services/ai
        run: pip install -e ".[dev,render-tts]"

      - name: Run AI service tests
        # Bare pytest: services/ai/pyproject.toml's testpaths decides what
        # runs (tests/, moderation/tests, render/tests), and its
        # conftest puts the repo root on sys.path for `contracts.*` and
        # `services.ai.*`. New suites under services/ai/<service>/tests
        # are picked up by adding them to that testpaths list, not here.
        working-directory: services/ai
        run: python -m pytest

  security-scans:
    # docs/security-checklist.md Part C. Two scans, deliberately with
    # different consequences:
    #
    #   secret-scan   BLOCKS. A pasted token in a commit is not fixed by
    #                 deleting it later -- it is in the history, and this
    #                 repository goes public under Apache-2.0 in Week 12.
    #                 Rewriting history after the fact is far more
    #                 expensive than failing a PR now.
    #
    #   dependency    REPORTS, does not block (|| true). A new CVE in a
    #   audit         transitive dependency can appear overnight, through
    #                 nobody's change; turning that into a red build on an
    #                 unrelated PR teaches people to ignore red builds.
    #                 Read it, act in a deliberate PR. Revisit before the
    #                 Week-12 release, where the standard should be higher.
    #
    # bandit (Part C item 3) is deliberately not here yet: it is noisy on a
    # codebase that has never run it, and landing it mid-Week-7 would bury
    # the two scans above in warnings. Its own PR, after integration day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree, so it needs
          # the whole thing -- the default shallow clone would miss exactly
          # the old commit a secret is most likely hiding in.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret scan (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit (report-only)
        # Every requirements file that describes something we actually run.
        # backbone/spike-* are deliberately excluded: they are the retired
        # Matrix/custom-lite spike record (ADR 0002), kept as evidence and
        # not deployed, so a CVE there is not a finding about this product.
        run: |
          pip-audit             -r services/gateway/requirements.txt             -r services/ai/render/requirements.txt             -r ai-services/requirements.txt             -r clients/elder-app/requirements.txt             || true

  # Branch protection currently requires `lint-and-test` only. gateway-tests
  # and ai-tests need adding to the required status checks by the repo admin
  # (satsandesh-project) -- otherwise a red run here does not block a merge.
  # Tracked in docs/journal/sainathan.md, 2026-09-22.
