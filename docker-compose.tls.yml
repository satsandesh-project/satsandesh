# Opt-in HTTPS for the shared stack, using Caddy's INTERNAL CA. Layer it on the base file:
#
#   TLS_HOST=10.110.11.31 docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d caddy
#
# What it is, and is not (infra/caddy/README.md has the long version):
#   - REAL HTTPS (TLS 1.3, a certificate valid for TLS_HOST) for any device that TRUSTS the
#     internal root certificate. A device that does not will show a certificate warning.
#   - NOT a public URL and NOT a Let's Encrypt certificate: that needs a domain and an inbound
#     path from the internet, neither of which this project has yet (docs/deployment.md).
#   - The routes are exactly the ones in infra/caddy/Caddyfile (the entrypoint derives the TLS
#     site from it); /moderation* stays unrouted. Plain HTTP on the container's :80 REDIRECTS (302)
#     to the HTTPS port; there is no HSTS (internal-CA certificate: it would lock testers out).
#   - Nothing changes unless you layer this file: the base compose and Caddyfile are untouched.
services:
  caddy:
    environment:
      TLS_HOST: ${TLS_HOST:?set TLS_HOST to the address or name browsers will use}
      # the host port browsers use for HTTPS: the http->https redirect must name it
      TLS_PUBLIC_PORT: ${CADDY_TLS_HOST_PORT:-8443}
    entrypoint: ["/bin/sh", "/tls-internal-entrypoint.sh"]
    command: []
    ports:
      # 443 inside the container -> a high host port, because the host's 80 belongs to a system
      # Apache and a shared host may have more taken. Browsers must then use https://host:PORT.
      - "${CADDY_TLS_HOST_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/tls-internal-entrypoint.sh:/tls-internal-entrypoint.sh:ro
      # Keep the internal root across restarts: without this the CA is regenerated on every
      # container re-create and every tester would have to trust a new root.
      - caddy_pki:/data

volumes:
  caddy_pki:
