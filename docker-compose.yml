services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, only against a fresh (empty) data dir.
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      # Repo root, so the image can include backbone/interfaces.py — the
      # contract the gateway's backbone client implements. See
      # .dockerignore for what's kept out of the context.
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Where the gateway reaches the backbone. Points at the custom-lite
      # spike because it's the only implementation that exists — NOT
      # because ADR 0002 has been decided (it hasn't). Swapping backbones
      # should be a change to this URL plus a client implementation, not a
      # change to gateway/circles.py.
      BACKBONE_URL: ${BACKBONE_URL:-http://spike-backbone:8000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-services:
    build:
      context: ./ai-services
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spike B (Week 2): custom-lite chat backbone, FastAPI WebSockets +
  # Postgres outbox. Exploratory, not part of the Week 1 shell — only
  # starts with `docker compose --profile spike up`, never with a plain
  # `docker compose up`. Reuses the existing postgres service; its schema
  # (spike_messages/spike_outbox) is applied by the app itself on startup,
  # separate from db/init/. See backbone/spike-custom-lite/ and
  # docs/adr/0002-chat-backbone.md.
  spike-backbone:
    profiles: ["spike"]
    build:
      # Repo root, so the image can include backbone/interfaces.py (the
      # contract this service implements), which lives outside this
      # service's own directory.
      context: .
      dockerfile: backbone/spike-custom-lite/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published directly (not routed through Caddy this week) so it's
      # reachable for manual poking during the spike without joining the
      # compose network.
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
    # Wait for both upstreams to be *healthy*, not merely started — otherwise
    # Caddy can accept traffic and 502 while uvicorn is still booting.
    depends_on:
      gateway:
        condition: service_healthy
      ai-services:
        condition: service_healthy

volumes:
  pgdata:
