services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, only against a fresh (empty) data dir.
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      # Overridable -- a shared host may already have something else bound
      # to 5432 (e.g. another project's own Postgres). Nothing else in
      # this stack reaches Postgres via the host port; every other
      # service talks to it over the compose-internal network by service
      # name, so remapping this is always safe.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Week 1 correction (2026-09-01): boots M3's services/gateway/, not
  # gateway/ (M2's) -- per docs/OWNERSHIP.md and the real Month 1 schedule
  # (SatSandesh_Month1_Schedule.docx), the gateway itself is M3's Week 1
  # task; M2's Week 1 task is this Compose skeleton, wiring together
  # whichever gateway/ai-services/postgres/caddy exist, not building the
  # gateway's own logic.
  #
  # gateway/ (M2's) removed from the repo entirely (2026-09-02): the team
  # confirmed services/gateway/ as the one gateway going forward, so the
  # parallel implementation was redundant.
  #
  # Matrix backbone removed (2026-09-05): ADR 0002 originally decided
  # Option A (Matrix/Tuwunel), and the tuwunel + matrix-circle-service
  # services lived here for that -- but the team has since superseded
  # that decision (see docs/adr/0002-chat-backbone.md's "Update
  # (2026-09-05)"): services/gateway/'s existing Postgres implementation
  # is the one going forward, not a Matrix cutover. Nothing depends on
  # Tuwunel or matrix-circle-service anymore, so removed rather than
  # left running unused -- see backbone/spike-matrix-a/README.md for
  # the archived Spike A material this used to run.
  gateway:
    build:
      # Repo root, not ./services/gateway -- it imports from contracts/
      # (contracts.chat.*, e.g. app/circles.py), which lives outside its
      # own directory. Found by actually running the built image, not
      # assumed: a services/gateway-only context built and started fine
      # until uvicorn tried to import app.main, which raised
      # ModuleNotFoundError: No module named 'contracts'. Locally,
      # services/gateway/conftest.py papers over this for tests by
      # manually adding the repo root to sys.path -- that trick is
      # pytest-only and does nothing for a real `uvicorn` process.
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      # postgres:5432, not localhost -- see services/gateway/README.md's
      # own "Docker gotcha" note, written in advance of this exact step.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${GATEWAY_JWT_SECRET}
      VAPID_PRIVATE_KEY: ${GATEWAY_VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${GATEWAY_VAPID_PUBLIC_KEY}
      VAPID_SUBJECT: ${GATEWAY_VAPID_SUBJECT:-mailto:dev@example.com}
      CORS_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # /health/ready, not /health -- confirms Postgres is actually
      # reachable (and, since the Dockerfile runs migrations before
      # uvicorn starts, that they applied), not just that the process
      # is up. See app/main.py's own comment on why the two are split.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-services:
    build:
      context: ./ai-services
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Week 4: placeholder elder client (see clients/elder-app/README.md --
  # not Member 1's real UI shell). In the base stack, not a profile: it's
  # core client wiring, not an exploratory spike. Degrades gracefully if
  # no backbone profile is up (the gateway's own /circles routes 503
  # cleanly; this client surfaces that as an inline warning rather than
  # failing to load).
  elder-app:
    build:
      context: ./clients/elder-app
    restart: unless-stopped
    environment:
      # Both need the ONE public origin the browser actually reaches --
      # Caddy serves the elder-app page and the gateway's routes from the
      # same origin (see infra/caddy/Caddyfile), so both read the same
      # variable rather than risking two independently-configured values
      # drifting apart.
      REFLEX_API_URL: ${PUBLIC_ORIGIN:-http://localhost}
      GATEWAY_PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      gateway:
        condition: service_healthy
    # Only 3000 -- the Dockerfile runs --env prod, which unifies frontend
    # and backend onto ONE port (see the Dockerfile's own comment for the
    # full reasoning). There is no separate 8000 to expose in this mode.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Spike B (Week 2): custom-lite chat backbone, FastAPI WebSockets +
  # Postgres outbox. Exploratory, not part of the Week 1 shell — only
  # starts with `docker compose --profile spike up`, never with a plain
  # `docker compose up`. Reuses the existing postgres service; its schema
  # (spike_messages/spike_outbox) is applied by the app itself on startup,
  # separate from db/init/. See backbone/spike-custom-lite/ and
  # docs/adr/0002-chat-backbone.md.
  spike-backbone:
    profiles: ["spike"]
    build:
      # Repo root, so the image can include backbone/interfaces.py (the
      # contract this service implements), which lives outside this
      # service's own directory.
      context: .
      dockerfile: backbone/spike-custom-lite/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published directly (not routed through Caddy this week) so it's
      # reachable for manual poking during the spike without joining the
      # compose network.
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Overridable -- a shared host may already have something bound to
      # 80 (e.g. a system-level Apache/Nginx a student has no permission
      # to touch). If you change this, ALLOWED_ORIGINS and PUBLIC_ORIGIN
      # must include the same non-default port -- browsers only omit the
      # port from the Origin header for a protocol's actual default (80
      # for http), not for whatever this happens to be set to.
      - "${CADDY_HOST_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
    # Wait for both upstreams to be *healthy*, not merely started — otherwise
    # Caddy can accept traffic and 502 while uvicorn is still booting.
    depends_on:
      gateway:
        condition: service_healthy
      ai-services:
        condition: service_healthy
      elder-app:
        condition: service_healthy

volumes:
  pgdata:
