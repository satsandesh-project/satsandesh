[project]
name = "satsandesh-ai"
version = "0.1.0"
description = "SatSandesh AI/GPU services (ASR, MT, TTS, moderation) — Student 3 slice"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faster-whisper>=1.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
]
# Microphone recording for the Week 5 bake-off (services/ai/tools/record_sample.py).
# Kept out of both `dependencies` and `dev`: a deployed transcribe service never
# touches a microphone, and this isn't needed to develop/test that service either.
tools = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real model weights and a CUDA GPU; skipped by default",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
