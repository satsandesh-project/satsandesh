[project]
name = "satsandesh-ai"
version = "0.1.0"
description = "SatSandesh AI/GPU services (ASR, MT, TTS, moderation) — Student 3 slice"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real model weights and a CUDA GPU; skipped by default",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
