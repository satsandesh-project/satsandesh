[project]
name = "satsandesh-ai"
version = "0.1.0"
description = "SatSandesh AI/GPU services (ASR, MT, TTS, moderation) — Student 3 slice"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faster-whisper>=1.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
]
# Microphone recording for the Week 5 bake-off (services/ai/tools/record_sample.py).
# Kept out of both `dependencies` and `dev`: a deployed transcribe service never
# touches a microphone, and this isn't needed to develop/test that service either.
tools = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
# Real moderation backend (services/ai/moderation/, MOD_BACKEND=llama_cpp).
# Kept out of `dependencies`: the stub backend and the whole test suite run
# without it, and llama-cpp-python compiles native code on install.
moderation = [
    "llama-cpp-python==0.3.35",
]
# MT bring-up (Week 6 Phase 1, services/ai/mt/). transformers is pinned, not
# left open: indictranstoolkit's own dependency declaration doesn't bound it,
# and the newest transformers (5.x) restructured transformers.tokenization_utils
# in a way that breaks IndicTransToolkit's collator import (`ImportError:
# cannot import name 'PreTrainedTokenizerBase'`). 4.44.2 is the version
# verified working in the Week 5 environment spike (see
# docs/MT_ENVIRONMENT_DECISION.md on docs/mt-environment-and-ci-findings,
# not yet merged to main as of this branch) — do not bump without
# re-running that smoke test.
mt = [
    "indictranstoolkit",
    "transformers==4.44.2",
    "torch",
    "sentencepiece",
]

[tool.pytest.ini_options]
testpaths = ["tests", "moderation/tests", "mt/tests"]
markers = [
    "integration: requires real model weights and a CUDA GPU; skipped by default",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
# This directory is a service tree run with the repo root on PYTHONPATH
# (`services.ai.*`, `contracts.*`), not an importable distribution. An
# editable install exists only to pull dependencies; with more than one
# top-level package here (mock/, moderation/, speech/) setuptools' auto-
# discovery refuses a flat layout, so discovery is turned off explicitly.
packages = []
